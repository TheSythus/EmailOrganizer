[imap]
# IMAP server hostname
# iCloud:  imap.mail.me.com
# Gmail:   imap.gmail.com
# Outlook: outlook.office365.com
host = imap.mail.me.com
port = 993
use_ssl = true

[credentials]
# Your email address
email = your.email@icloud.com
# Your password or app-specific password
# For iCloud: generate an app-specific password at https://appleid.apple.com
# For Gmail:  generate an app-specific password at https://myaccount.google.com/apppasswords
password = your-app-specific-password

[folders]
# Source folder to scan (usually INBOX)
source = INBOX
# Folder name for advertising/promotional emails
advertising = Advertising
# Folder name for spam emails
spam = Spam

[claude]
# Anthropic API key (or set ANTHROPIC_API_KEY environment variable)
# Get your key at https://console.anthropic.com/settings/keys
api_key =
# Claude model to use for classification (claude-sonnet-4-20250514 is fast and accurate)
model = claude-sonnet-4-20250514

[options]
# Only process emails from the last N days (0 = all emails)
days_to_scan = 30
# Dry run mode - log what would be moved without actually moving (true/false)
dry_run = true
# Number of emails to process per run (0 = unlimited)
batch_size = 100
